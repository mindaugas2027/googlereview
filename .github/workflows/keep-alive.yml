name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase auth health endpoint
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Missing SUPABASE_URL or NEXT_PUBLIC_SUPABASE_URL GitHub secret}"
          : "${SUPABASE_ANON_KEY:?Missing SUPABASE_ANON_KEY or NEXT_PUBLIC_SUPABASE_ANON_KEY GitHub secret}"

          # Use Supabase's built-in health endpoint instead of a table endpoint.
          # This is independent from app migrations and always exists on a valid project.
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            --output /dev/null \
            --write-out 'Supabase auth health responded with HTTP %{http_code}\n' \
            "${SUPABASE_URL%/}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}"
