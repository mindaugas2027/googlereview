name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Wake Supabase using a real health check
        shell: bash
        run: |
          set -euo pipefail

          : "${SUPABASE_URL:?Missing SUPABASE_URL or NEXT_PUBLIC_SUPABASE_URL GitHub secret}"
          : "${SUPABASE_ANON_KEY:?Missing SUPABASE_ANON_KEY or NEXT_PUBLIC_SUPABASE_ANON_KEY GitHub secret}"

          echo "Checking Supabase health at ${SUPABASE_URL%/}/auth/v1/health"
          HTTP_CODE=$(curl --silent --show-error --location \
            --output /tmp/supabase-health-response.txt \
            --write-out '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/auth/v1/health") || true

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response body:"
          cat /tmp/supabase-health-response.txt || true

          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "Supabase health check failed. Verify SUPABASE_URL and SUPABASE_ANON_KEY secrets."
            exit 1
          fi

          echo "Supabase health OK. Project is awake."
